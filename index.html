<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Right Side People is a Singapore digital marketing agency. Your entire marketing team, without the entire payroll."
    />
    <title>Right Side People — Digital Marketing, Singapore</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,520,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page">
      <div class="page-overlay" aria-hidden="true"></div>

      <header class="nav" data-nav>
        <div class="nav-inner">
          <div class="nav-left">
            <a class="brand" href="/" aria-label="Right Side People home">
              <svg class="brand-logo" viewBox="0 0 430 156" width="148" height="54" role="img" aria-hidden="true">
                <text x="6" y="86" fill="#E3BC2F" font-size="78" font-weight="900" letter-spacing="-3">RIGHT</text>
                <path fill="#E3BC2F" d="M276 16 372 78 276 140V16Z"/>
                <rect x="118" y="96" width="38" height="38" fill="#C53630"/>
                <rect x="168" y="104" width="32" height="32" fill="#4DBFD0"/>
                <circle cx="204" cy="136" r="20" fill="#7B57B2"/>
                <path fill="#69A83C" d="M328 94h42l-21 38-21-38Z"/>
                <text x="10" y="148" fill="#E3BC2F" font-size="20" font-style="italic" font-family="Georgia, 'Times New Roman', serif">people</text>
              </svg>
            </a>
            <span class="nav-rule" aria-hidden="true"></span>
            <nav class="nav-links" aria-label="Primary">
              <a href="#services">Services</a>
              <a href="#work">Work</a>
              <a href="#about">About</a>
              <a href="#insights">Insights</a>
            </nav>
          </div>
          <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="mobile-menu"
            data-nav-toggle
          >
            <span class="sr-only">Open menu</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 5H21M3 12H21M3 19H21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <div class="mobile-menu" id="mobile-menu" data-mobile-menu hidden>
        <nav aria-label="Mobile">
          <a href="#services">Services</a>
          <a href="#work">Work</a>
          <a href="#about">About</a>
          <a href="#insights">Insights</a>
          <a class="mobile-cta" href="#book">Book a call</a>
        </nav>
      </div>

      <main id="main" class="hero">
        <div class="hero-inner">
          <a class="pill" href="#book">
            <span class="pill-shine" aria-hidden="true"></span>
            <span class="pill-label">Singapore’s marketing team, on tap</span>
          </a>

          <div class="hero-copy">
            <h1 class="hero-title" data-hero-title>
              <span class="hero-line">
                <span class="word">Your</span>
                <span class="word">Entire</span>
                <span class="word">Marketing</span>
                <span class="word">Team.</span>
              </span>
              <span class="hero-line">
                <span class="word">Without</span>
                <span class="word">the</span>
                <span class="word">Entire</span>
                <span class="word">Payroll.</span>
              </span>
            </h1>
            <p class="hero-sub" data-hero-sub>
              More visibility. More qualified leads. More revenue.
            </p>
          </div>

          <div class="hero-actions" data-hero-actions>
            <a class="btn btn-primary" href="#book">
              <span>Book a call</span>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path class="arrow-head" d="M9 6l7 6-7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path class="arrow-shaft" d="M16 12H4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </a>
            <a class="btn btn-secondary" href="#more">Learn more</a>
          </div>

          <div class="logo-field" id="more" data-logo-field aria-label="Client logos">
            <div class="logo-rows" data-logo-rows></div>
            <div class="logo-marquee" data-logo-marquee>
              <div class="logo-track" data-logo-track></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
